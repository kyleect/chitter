[package]
name = "server"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
axum = { version = "0.8.0", features = ["macros", "ws", "multipart"] }
axum-extra = { version = "0.10.1" }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.8", features = [
    "fs",
    "trace",
    "compression-br",
    "compression-deflate",
    "compression-gzip",
] }
bon = "3.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-serve-static = "0.1.1"
include_dir = "0.7.0"
webbrowser = "1"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5.32", features = ["derive", "env"] }
ts-rs = "10.1"
types = { path = "../types" }
chrono = { version = "0.4.41", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher"] }
futures-util = "0.3.31"
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1" }
glob = "0.3.2"
dotenv = "0.15.0"
async-openai = { version = "0.33.0", features = [
    "completions",
    "chat-completion",
] }
card-parser = { path = "../card-parser" }

[dependencies.uuid]
version = "1.19.0"
features = ["v4"]

[dev-dependencies]
pretty_assertions = "1.4"

[features]
development_mode = []

[[bin]]
name = "chitter-browser"
path = "src/main.rs"
