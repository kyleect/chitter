[package]
name = "types"
version = "0.1.0"
edition = "2024"

[dependencies]
ts-rs = "10.1"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.41", features = ["serde"] }
thiserror = "2"
sqlx = { version = "0.8" }
bon = "3.9"

[dependencies.uuid]
version = "1.21.0"
# Lets you generate random UUIDs
features = ["v4"]

[dev-dependencies]
pretty_assertions = "1"

[features]
bundle_types = []

[[bin]]
name = "bundle_types"
path = "src/bin/bundle.rs"
required-features = ["bundle_types"]
